# =============================================================================
# config.yaml — single source of truth for paths, target definition, splits,
# and model hyperparameters. Every script/notebook reads from this file so
# that changing an assumption (e.g. the split ratio) never requires touching
# code in more than one place.
# =============================================================================

project:
  name: "book-market-intelligence"
  random_seed: 42

paths:
  raw_data: "data/raw/global_book_market_intelligence_2026.csv"
  clean_data: "data/processed/books_clean.parquet"
  train_data: "data/processed/train.parquet"
  val_data: "data/processed/val.parquet"
  test_data: "data/processed/test.parquet"
  model_dir: "models/"
  reports_dir: "reports/"
  figures_dir: "reports/figures/"

# -----------------------------------------------------------------------------
# Target definition
#
# We deliberately do NOT model `rating_score` (book "quality") as the primary
# target. EDA shows |corr(rating_score, any metadata feature)| < 0.07 — there
# is essentially no linear or tree-recoverable signal in catalog metadata for
# subjective quality. Modeling it as a headline task would produce a model
# that looks legitimate but is not (R^2 ~ 0). See reports/eda_report.md
# and reports/model_card.md, section "Why rating_score is not the target".
#
# Instead the primary target is `is_rated`: whether a book has accumulated
# ANY reader engagement at all (rating_count > 0). This is a genuine market
# question ("will this title get read/reviewed") with real, explainable
# signal (edition_count, translation reach, genre, publisher/author history).
# -----------------------------------------------------------------------------
target:
  name: "is_rated"
  definition: "rating_count.notnull() & (rating_count > 0)"
  positive_label: "Rated (has_reader_engagement)"
  negative_label: "Unrated (no_reader_engagement)"

split:
  train_frac: 0.70
  val_frac: 0.15
  test_frac: 0.15
  stratify_on: "is_rated"

features:
  numeric:
    - author_count
    - edition_count_log
    - pages_log
    - language_count
    - book_age_years
  binary:
    - is_multilingual
    - has_isbn
    - pages_missing
  categorical:
    - genre
    - primary_language_grouped
    - book_length_category
  target_encoded:
    - primary_author
    - primary_publisher
  excluded_leakage:
    - rating_score        # part of / downstream of target definition
    - rating_count         # IS the target
    - rating_tier           # derived from rating_score + rating_count
    - title                 # free text identifier, not predictive metadata

target_encoding:
  n_folds: 5
  smoothing_m: 20        # Bayesian smoothing strength (higher = trust global mean more)
  min_category_freq: 1

language_grouping:
  keep_top_n: 6          # languages kept as their own category; rest -> "other"

models:
  logistic_regression:
    C: 1.0
    class_weight: "balanced"
    max_iter: 2000
  random_forest:
    n_estimators: 400
    max_depth: 12
    min_samples_leaf: 5
    class_weight: "balanced"
  xgboost:
    n_estimators: 400
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 5
    eval_metric: "aucpr"

evaluation:
  primary_metric: "average_precision"   # PR-AUC — appropriate for ~32% positive rate
  cv_folds: 5
